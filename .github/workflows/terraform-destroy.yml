name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm teardown of all infrastructure'
        required: true

env:
  AWS_REGION: ap-southeast-2

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create backend config
        run: |
          cat > terraform/backend.tfvars <<EOF
          bucket = "${{ secrets.TF_STATE_BUCKET }}"
          key    = "converter/terraform.tfstate"
          region = "${{ env.AWS_REGION }}"
          EOF

      - name: Create tfvars
        run: |
          cat > terraform/terraform.tfvars <<EOF
          source_bucket      = "${{ secrets.SOURCE_BUCKET }}"
          notification_email = "${{ secrets.NOTIFICATION_EMAIL }}"
          frontend_url       = "${{ secrets.FRONTEND_URL }}"
          image_tag          = "latest"
          EOF

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend-config=backend.tfvars

      - name: Terraform Destroy
        run: terraform -chdir=terraform destroy -auto-approve
