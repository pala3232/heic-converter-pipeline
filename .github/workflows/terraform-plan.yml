name: Terraform Plan

on:
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create backend config
        run: |
          cat > terraform/backend.tfvars <<EOF
          bucket = "${{ secrets.TF_STATE_BUCKET }}"
          key    = "converter/terraform.tfstate"
          region = "${{ env.AWS_REGION }}"
          EOF

      - name: Create tfvars
        run: |
          cat > terraform/terraform.tfvars <<EOF
          source_bucket      = "${{ secrets.SOURCE_BUCKET }}"
          notification_email = "${{ secrets.NOTIFICATION_EMAIL }}"
          frontend_url       = "${{ secrets.FRONTEND_URL }}"
          image_tag          = "latest"
          EOF

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend-config=backend.tfvars

      - name: Terraform Plan
        id: plan
        run: terraform -chdir=terraform plan -no-color
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
