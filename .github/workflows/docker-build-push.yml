name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: iosglacierbackupsconversion

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} ./converter
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          echo "Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create backend config
        run: |
          cat > terraform/backend.tfvars <<EOF
          bucket = "${{ secrets.TF_STATE_BUCKET }}"
          key    = "converter/terraform.tfstate"
          region = "${{ env.AWS_REGION }}"
          EOF

      - name: Create tfvars
        run: |
          cat > terraform/terraform.tfvars <<EOF
          source_bucket      = "${{ secrets.SOURCE_BUCKET }}"
          notification_email = "${{ secrets.NOTIFICATION_EMAIL }}"
          frontend_url       = "${{ secrets.FRONTEND_URL }}"
          image_tag          = "${{ github.sha }}"
          EOF

      - name: Terraform Init
        run: terraform -chdir=terraform init -backend-config=backend.tfvars

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve
